<div class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
        <div class="rounded-2xl border border-white/10 bg-white/5 shadow-xl backdrop-blur p-6 sm:p-8">
            <div class="mb-6">
                <h1 class="text-2xl font-semibold">Email Verification</h1>
            </div>

            <div class="space-y-4">
                <!-- Code -->
                <div>
                    <label class="block text-sm mb-1 text-slate-200">Verification Code</label>
                    <input type="text" (change)="this.onValueChange($event)"
                        class="w-full rounded-xl bg-slate-900/60 border border-white/10 px-4 py-3 outline-none focus:ring-2 focus:ring-white/20" />
                </div>

                <!-- Submit -->
                <div class="flex justify-around">
                    @if (!this.sent()){
                        <button type="button" (click)="this.onSend()"
                            class="rounded-xl cursor-pointer bg-white text-slate-950 font-medium py-3 px-3 hover:bg-slate-100 disabled:opacity-60 disabled:cursor-not-allowed">
                            <span>Send</span>
                        </button>
                    } @else {
                        <button type="button" (click)="this.onConfirm()"
                            class="rounded-xl cursor-pointer bg-white text-slate-950 font-medium py-3 px-3 hover:bg-slate-100 disabled:opacity-60 disabled:cursor-not-allowed">
                            <span>Confirm</span>
                        </button>
                    }

                </div>
            </div>
        </div>
    </div>
</div>
